name: Build Android SDK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  NDK_VERSION: 30.0.16248370
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
        api: [26, 31]
        include:
          - abi: riscv64
            api: 37
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build production libraries and Native hosts
        run: |
          android=(-G Ninja "-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake"
            -DANDROID_ABI='${{ matrix.abi }}' -DANDROID_PLATFORM=android-${{ matrix.api }})
          cmake -S . -B out/sdk "${android[@]}"
          cmake --build out/sdk --parallel 4
          cmake --install out/sdk --prefix "$PWD/out/install"
          cmake -S tests -B out/hosts "${android[@]}"
          cmake --build out/hosts --parallel 4
      - name: Build installed and source consumers
        shell: bash
        run: |
          for form in archive sources; do
            for language in C CXX; do
              cmake -S tests/consumer -B "out/$form-$language" -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI='${{ matrix.abi }}' -DANDROID_PLATFORM=android-${{ matrix.api }} \
                -DYUKILINKER_RUNTIME_FORM="$form" -DYUKILINKER_CONSUMER_LANGUAGE="$language" \
                -DYukiLinker_DIR="$PWD/out/install/lib/cmake/YukiLinker"
              cmake --build "out/$form-$language" --target core --parallel 4
            done
          done
      - name: Consume the API 26 archive from API 31
        if: matrix.api == 26
        run: |
          cmake -S tests/consumer -B out/consumer-31 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI='${{ matrix.abi }}' -DANDROID_PLATFORM=android-31 \
            -DYUKILINKER_RUNTIME_FORM=archive -DYUKILINKER_CONSUMER_LANGUAGE=CXX \
            -DYukiLinker_DIR="$PWD/out/install/lib/cmake/YukiLinker"
          cmake --build out/consumer-31 --target core --parallel 4
      - name: Find the compatible SDK across installation prefixes
        if: matrix.api == 31 && matrix.abi == 'arm64-v8a'
        run: |
          android=(-G Ninja "-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake"
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26)
          cmake -S . -B out/sdk-26 "${android[@]}"
          cmake --build out/sdk-26 --parallel 4
          cmake --install out/sdk-26 --prefix "$PWD/out/install-26"
          cmake -S tests/consumer -B out/search "${android[@]}" \
            "-DCMAKE_FIND_ROOT_PATH=$PWD/out/install;$PWD/out/install-26"
          grep -Fxq "YukiLinker_DIR:PATH=$PWD/out/install-26/lib/cmake/YukiLinker" out/search/CMakeCache.txt
          cmake --build out/search --target core --parallel 4
      - uses: actions/upload-artifact@v4
        if: matrix.api == 26 || (matrix.abi == 'riscv64' && matrix.api == 37)
        with:
          name: yukilinker-${{ matrix.abi }}
          path: out/install/
